<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Insert title here</title>
</head>
<body>
<form method="post" action="./DealResumes">
    <table>
        <tr>
            <td>姓名</td>
            <td><input type="text" name="username"></td>
        </tr>
        <tr>
            <td>性别</td>
            <td><input type="radio" name="sex" value="男" checked>男
                <input type="radio" name="sex" value="女">女
            </td>
        </tr>
        <tr>
            <td>学历</td>
            <td>
                <select name="degree">
                    <option>--请选择--</option>
                    <option value="高中">高中</option>
                    <option value="专科">专科</option>
                    <option value="本科">本科</option>
                    <option value="研究生">研究生</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>擅长技术</td>
            <td>
                <input type="checkbox" name="adept" value="Java">Java
                <input type="checkbox" name="adept" value=".NET">.NET
                <input type="checkbox" name="adept" value="Android">Android
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <input type="submit" value="确定">&nbsp;&nbsp;
                <input type="reset" value="重置">
            </td>
        </tr>
    </table>
</form>
</body>
</html>
